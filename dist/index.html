function verify(id){const b=data.bills.find(b=>b.id===id);if(role!=='bm'||b.status!=='Menunggu verifikasi')return;b.status='Lunas';save();closeModal();render();toast('Pembayaran terverifikasi. Kuitansi sudah tersedia.')}
function receipt(id){const b=data.bills.find(b=>b.id===id);download('Kuitansi-'+id+'.html',`<!doctype html><html lang="id"><meta charset="utf-8"><title>Kuitansi demo</title><body style="font:16px Arial;max-width:650px;margin:70px auto;color:#184b3e"><p>HUNI · TAMAN HARMONI RESIDENCES</p><h1>Kuitansi pembayaran</h1><p>DATA DEMO — BUKAN BUKTI TRANSAKSI RIIL</p><hr><p>${b.id} · Unit ${b.unit}</p><p>Diterima dari: ${esc(resident(b.unit))}</p><h2>${money(total(b))}</h2><p>IPL ${money(b.ipl)} · Listrik ${money(b.electric)} · Air ${money(b.water)} · Sinking fund ${money(b.fund)}</p><p>Periode ${b.period} · Status LUNAS</p><p>Referensi: ${esc(b.reference||'SEED-DEMO')}</p></body></html>`,'text/html');toast('Kuitansi demo berhasil diunduh.')}
function newBilling(){openModal('Terbitkan tagihan','Tarif contoh IPL Rp15.000/m² dan sinking fund Rp2.000/m².',`<form onsubmit="createBilling(event)"><label class="field">Unit<select name="unit">${data.units.map(u=>`<option value="${u.id}">${u.id} · ${esc(u.name)}</option>`).join('')}</select></label><div class="formgrid"><label class="field">Periode<input type="month" name="period" value="2026-11" required></label><label class="field">Jatuh tempo<input type="date" name="due" value="2026-11-10" required></label><label class="field">Listrik (Rp)<input type="number" name="electric" value="325000" min="0" max="100000000" required></label><label class="field">Air (Rp)<input type="number" name="water" value="85000" min="0" max="100000000" required></label></div><div class="hint" id="billpreview"></div><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Terbitkan invoice</button></div></form>`);const form=$('dialog form');form.oninput=()=>{const f=new FormData(form),u=data.units.find(u=>u.id===f.get('unit'));$('#billpreview').textContent='Total perkiraan: '+money(u.area*17000+Number(f.get('electric'))+Number(f.get('water')))};form.oninput()}
function createBilling(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(data.bills.some(b=>b.unit===f.unit&&b.period===f.period)){toast('Unit ini sudah memiliki tagihan untuk periode tersebut.');return}if(f.due.slice(0,7)<f.period){toast('Jatuh tempo tidak boleh sebelum periode tagihan.');return}const u=data.units.find(u=>u.id===f.unit);data.bills.push({id:'INV-'+f.period.replace('-','')+'-'+String(data.bills.length+1).padStart(3,'0'),unit:f.unit,period:f.period,due:f.due,ipl:u.area*15000,fund:u.area*2000,electric:Number(f.electric),water:Number(f.water),status:f.due<'2026-10-29'?'Menunggak':'Belum bayar'});save();closeModal();render();toast('Invoice terbit. Total dihitung dari luas unit dan biaya utilitas.')}
function requestsPage(){return heading('Layanan & persetujuan',role==='tenant'?'Izin & aduan saya':'Perizinan & aduan','Pantau permohonan dari pengajuan hingga penyelesaian.',btn('Buat pengajuan','requestForm()',true,'plus'))+`<div class="notice">Alur renovasi: Pengajuan → Review Engineering → Review Pengelola → Disetujui. Aduan dapat ditugaskan kepada teknisi.</div><section class="panel">${filtersMarkup('Cari pengajuan, unit, atau jenis…',['Semua','Diajukan','Review Engineering','Review Pengelola','Disetujui','Ditolak','Dikerjakan','Selesai'])}<div class="tablewrap"><table><thead><tr><th>PENGAJUAN</th><th>UNIT</th><th>JENIS</th><th>JADWAL</th><th>STATUS</th><th></th></tr></thead><tbody id="rows">${requestRows()}</tbody></table></div></section>`}
function requestRows(){return data.requests.filter(r=>(role!=='tenant'||r.unit==='A-1205')&&(r.title+' '+r.unit+' '+r.type).toLowerCase().includes(query.toLowerCase())&&(filter==='Semua'||r.status===filter)).map(r=>`<tr><td><strong>${esc(r.title)}</strong><small>${r.id}</small></td><td>${r.unit}</td><td>${esc(r.type)}</td><td>${r.start}</td><td>${statusBadge(r.status)}</td><td><button class="link" onclick="requestDetail('${r.id}')">Tinjau ↗</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Belum ada pengajuan yang sesuai.</td></tr>'}
function requestForm(){openModal('Buat pengajuan','Ajukan izin atau laporkan kendala pada pengelola.',`<form onsubmit="submitRequest(event)"><div class="formgrid"><label class="field">Unit<select name="unit">${data.units.filter(u=>role!=='tenant'||u.id==='A-1205').map(u=>`<option>${u.id}</option>`).join('')}</select></label><label class="field">Jenis pengajuan<select name="type" onchange="requestFields(this.value)"><option>Renovasi</option><option>Pindahan</option><option>Fasilitas komunal</option><option>Aduan</option></select></label></div><label class="field">Judul / jenis pekerjaan<input name="title" required maxlength="100" placeholder="Contoh: Pemasangan kitchen set"></label><label class="field">Rincian<textarea name="description" required maxlength="1000" placeholder="Jelaskan kebutuhan atau kendala Anda…"></textarea></label><div class="formgrid"><label class="field">Tanggal mulai<input name="start" type="date" value="2026-10-30" min="2026-10-29" required></label><label class="field">Tanggal selesai<input name="end" type="date" value="2026-10-30" min="2026-10-29" required></label></div><div id="requestExtra"></div><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Kirim pengajuan</button></div></form>`);requestFields('Renovasi')}
function requestFields(type){$('#requestExtra').innerHTML=type==='Renovasi'?`<label class="field">Identitas kontraktor & penanggung jawab<input name="contractor" required placeholder="Nama perusahaan, PIC, dan nomor identitas contoh" maxlength="120"></label><div class="formgrid"><label class="field">Jam kerja<input name="hours" value="09.00–16.00" required></label><label class="field">Jaminan renovasi (Rp)<input name="deposit" type="number" value="2000000" min="0" required></label></div><label class="field">Lampiran identitas contoh<input type="file" name="attachment" accept="image/*,.pdf" required></label><p class="hint">Gunakan identitas fiktif. Hanya nama berkas disimpan di browser.</p>`:type==='Pindahan'?'<label class="field">Slot lift barang<select name="slot"><option>10.00–12.00</option><option>13.00–15.00</option></select></label>':type==='Fasilitas komunal'?'<label class="field">Fasilitas<select name="facility"><option>Ruang serbaguna</option><option>Clubhouse</option></select></label><label class="field">Jam pemakaian<select name="slot"><option>09.00–12.00</option><option>13.00–16.00</option></select></label>':''}
function submitRequest(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(f.end<f.start){toast('Tanggal selesai harus sama atau setelah tanggal mulai.');return}if(['Pindahan','Fasilitas komunal'].includes(f.type)&&data.requests.some(r=>r.type===f.type&&r.start===f.start&&r.status!=='Ditolak'&&r.slot===f.slot&&(f.type!=='Fasilitas komunal'||r.facility===f.facility))){toast('Slot tersebut sudah dipesan. Pilih jadwal lain.');return}if(f.attachment)f.attachment=f.attachment.name;data.requests.push({...f,deposit:Number(f.deposit||0),id:'REQ-'+String(data.requests.length+1).padStart(3,'0'),status:f.type==='Renovasi'?'Review Engineering':'Diajukan',note:''});save();closeModal();render();toast('Pengajuan tersimpan dan masuk ke antrean pengelola.')}
function requestDetail(id){const r=data.requests.find(r=>r.id===id);openModal(r.title,r.id+' · '+r.unit+' · '+r.type,`${statusBadge(r.status)}<p style="margin:18px 0">${esc(r.description)}</p><div class="billrows"><div><span class="muted">Jadwal</span><strong>${r.start} s/d ${r.end}</strong></div>${r.contractor?`<div><span class="muted">Kontraktor</span><strong>${esc(r.contractor)}</strong></div><div><span class="muted">Jam kerja</span><strong>${esc(r.hours)}</strong></div><div><span class="muted">Deposit jaminan</span><strong>${money(r.deposit)}</strong></div>`:''}${r.attachment?`<div><span>Lampiran demo</span><strong>${esc(r.attachment)}</strong></div>`:''}${r.slot?`<div><span>Slot jadwal</span><strong>${esc(r.slot)}</strong></div>`:''}${r.facility?`<div><span>Fasilitas</span><strong>${esc(r.facility)}</strong></div>`:''}</div>${r.note?`<div class="notice">Catatan: ${esc(r.note)}</div>`:''}${r.type==='Renovasi'?`<div class="timeline"><strong>Alur persetujuan</strong><span>1. Engineering · ${r.status==='Review Engineering'?'Menunggu tinjauan':'Tinjauan tercatat'}</span><span>2. Kepala pengelola · ${r.status==='Disetujui'?'Disetujui':'Menunggu / dalam antrean'}</span></div>`:''}<div class="actions">${role==='bm'&&!['Disetujui','Ditolak','Selesai'].includes(r.status)?btn(r.type==='Aduan'?(r.status==='Dikerjakan'?'Tandai selesai':'Tugaskan teknisi'):r.status==='Review Engineering'?'Lolos Engineering':'Setujui pengajuan',`advanceRequest('${id}')`,true,'check')+btn('Tolak',`rejectForm('${id}')`):''}${r.status==='Disetujui'?btn('Unduh izin demo',`permit('${id}')`,true,'download'):''}</div>${r.status==='Disetujui'?'<p class="hint">Izin demo dapat diunduh. QR keamanan dan pemeriksaan akses belum diintegrasikan.</p>':''}`)}
function advanceRequest(id){const r=data.requests.find(r=>r.id===id);if(role!=='bm')return;r.status=r.type==='Aduan'?(r.status==='Dikerjakan'?'Selesai':'Dikerjakan'):r.status==='Review Engineering'?'Review Pengelola':'Disetujui';if(r.type==='Aduan'&&r.status==='Dikerjakan'){data.tasks.push({id:Math.max(...data.tasks.map(t=>t.id))+1,title:r.title,target:r.unit,vendor:'PT Elevasi Teknik',category:'Engineering',date:r.start,checks:[false,false,false],labels:['Periksa kondisi dan penyebab','Laksanakan perbaikan','Uji fungsi dan konfirmasi penghuni'],status:'Belum dimulai',requestId:r.id});r.note='Ditugaskan ke PT Elevasi Teknik.'}if(r.type==='Renovasi'&&r.status==='Disetujui'){const u=data.units.find(u=>u.id===r.unit);u.status='Renovasi'}save();closeModal();render();toast('Status pengajuan: '+r.status)}
function rejectForm(id){openModal('Tolak pengajuan','Catatan akan terlihat oleh penghuni.',`<form onsubmit="event.preventDefault();rejectRequest('${id}',this.note.value)"><label class="field">Alasan penolakan<textarea name="note" required maxlength="500"></textarea></label><div class="modalactions"><button type="button" class="btn" onclick="requestDetail('${id}')">Kembali</button><button class="btn danger">Tolak pengajuan</button></div></form>`)}
function rejectRequest(id,note){const r=data.requests.find(r=>r.id===id);r.status='Ditolak';r.note=note;save();closeModal();render();toast('Pengajuan ditolak dengan catatan.')}
function permit(id){const r=data.requests.find(r=>r.id===id);download('Izin-demo-'+id+'.html',`<!doctype html><html lang="id"><meta charset="utf-8"><title>Izin demo</title><body style="font:16px Arial;max-width:650px;margin:70px auto"><p>HUNI · TAMAN HARMONI</p><h1>Izin ${esc(r.type)}</h1><p>SIMULASI — TIDAK BERLAKU UNTUK AKSES KEAMANAN</p><hr><h2>${esc(r.title)}</h2><p>${id} · Unit ${r.unit}</p><p>Jadwal: ${r.start} sampai ${r.end}</p><p>Kontraktor: ${esc(r.contractor||'Tidak berlaku')}</p><p>Status: Disetujui</p><p>Kode izin demo: HUNI-${id}</p><p>QR akses keamanan belum diintegrasikan.</p></body></html>`,'text/html');toast('Dokumen izin demo diunduh.')}
function portalPage(){const b=data.bills.filter(b=>b.unit==='A-1205').find(b=>b.status!=='Lunas')||data.bills.find(b=>b.unit==='A-1205');return heading('Portal penghuni','Selamat datang, Aditya.','Semua kebutuhan hunian Anda, lebih dekat dan lebih mudah.')+`<div class="tenantgrid"><div><div class="unitcard"><div class="rowflex"><small>UNIT ANDA</small><span class="badge" style="background:#ffffff22;color:white">Pemilik</span></div><h2>Tower A · 1205</h2><p>Taman Harmoni Residences</p><div style="margin-top:18px"><small>2 kamar tidur &nbsp; · &nbsp; 54 m² &nbsp; · &nbsp; 3.500 VA</small></div></div><section class="panel"><div class="cardbody"><div class="rowflex"><h2>Tagihan hunian</h2>${statusBadge(b.status)}</div><p>Periode ${b.period} · ${b.id}</p><div class="bigbill">${money(total(b))}</div><small>Jatuh tempo: ${b.due}</small><div class="billrows"><div><span>IPL</span><strong>${money(b.ipl)}</strong></div><div><span>Listrik & air</span><strong>${money(b.electric+b.water)}</strong></div><div><span>Sinking fund</span><strong>${money(b.fund)}</strong></div></div>${btn(b.status==='Lunas'?'Unduh kuitansi':'Lihat & konfirmasi pembayaran',b.status==='Lunas'?`receipt('${b.id}')`:`invoice('${b.id}')`,true,'bill')}</div></section></div><div><section class="panel"><div class="cardbody"><h2>Apa yang bisa kami bantu?</h2><p>Ajukan kebutuhan Anda tanpa datang ke kantor pengelola.</p><div style="display:grid;gap:10px">${btn('Ajukan izin renovasi / pindahan','requestForm()',false,'request')}${btn('Laporkan kendala','requestForm();$(\'dialog select[name=type]\').value=\'Aduan\';requestFields(\'Aduan\')',false,'tool')}${btn('Pesan layanan hunian',"go('market')",false,'shop')}</div></div></section><section class="panel" style="margin-top:22px"><div class="cardbody"><h2>Pengumuman gedung</h2><p><strong style="color:var(--ink)">Perawatan lift Tower A</strong><br>29 Oktober 2026 · 09.00–11.00<br>Gunakan lift 02 selama pekerjaan berlangsung.</p><hr style="border:0;border-top:1px solid var(--line)"><p><strong style="color:var(--ink)">Jam kerja renovasi</strong><br>Senin–Jumat, 09.00–16.00. Pastikan izin sudah disetujui sebelum pekerjaan.</p></div></section></div></div>`}
function vendorPage(){const tasks=data.tasks.filter(t=>role!=='vendor'||t.vendor==='PT Elevasi Teknik');return heading('Operasional gedung',role==='vendor'?'Pekerjaan saya':'Vendor & pemeliharaan',role==='vendor'?'PT Elevasi Teknik · Checklist lapangan dan laporan pekerjaan.':'Jadwal perawatan, vendor penanggung jawab, dan progres pekerjaan.')+`<div class="metrics">${metric('Total pekerjaan',tasks.length,'Agenda pemeliharaan demo','tool')}${metric('Belum dimulai',tasks.filter(t=>t.status==='Belum dimulai').length,'Siap untuk dikerjakan','request')}${metric('Dikerjakan',tasks.filter(t=>t.status==='Dikerjakan').length,'Checklist sedang berjalan','tool')}${metric('Selesai',tasks.filter(t=>t.status==='Selesai').length,'Seluruh pemeriksaan selesai','check')}</div><div class="cards">${tasks.map(t=>`<section class="panel"><div class="cardbody"><div class="rowflex"><span class="cardicon">${icon('tool')}</span>${statusBadge(t.status)}</div><h2>${esc(t.title)}</h2><p>${esc(t.target)}<br>${esc(t.vendor)} · ${t.date}</p><div class="rowflex"><small>Checklist pemeriksaan</small><small>${t.checks.filter(Boolean).length}/${t.checks.length}</small></div><div class="progress"><div style="width:${t.checks.filter(Boolean).length/t.checks.length*100}%"></div></div><button class="btn ${t.status==='Selesai'?'':'primary'}" onclick="taskModal(${t.id})">${t.status==='Selesai'?'Lihat laporan':'Buka checklist'} &nbsp; ↗</button></div></section>`).join('')}</div><p class="hint">Masuk dengan akun vendor untuk memperbarui checklist tugas PT Elevasi Teknik. Pengelola dapat memantau laporan. Login dan pembatasan peran ini merupakan simulasi di browser.</p>`}
function taskModal(id){const t=data.tasks.find(t=>t.id===id);openModal(t.title,t.vendor+' · '+t.target,`<div class="rowflex">${statusBadge(t.status)}<small>Jadwal ${t.date}</small></div><form onsubmit="completeTask(event,${id})"><div class="checklist">${t.labels.map((l,i)=>`<label><input type="checkbox" name="check${i}" ${t.checks[i]?'checked':''} ${t.status==='Selesai'||role!=='vendor'?'disabled':''} onchange="updateCheck(${id},${i},this.checked)">${esc(l)}</label>`).join('')}</div><label class="field">Catatan hasil pemeriksaan<textarea name="note" ${t.status==='Selesai'||role!=='vendor'?'readonly':''} placeholder="Catat kondisi peralatan dan tindakan yang dilakukan…" oninput="saveTaskNote(${id},this.value)">${esc(t.note||'')}</textarea></label>${t.status==='Selesai'?'<div class="notice">Seluruh pemeriksaan selesai. Laporan demo telah tersimpan.</div>':role!=='vendor'?'<div class="notice">Tampilan pengelola: pemantauan checklist. Pembaruan pekerjaan dilakukan melalui akun vendor.</div>':'<p class="hint">Centang seluruh pemeriksaan dan isi catatan untuk menyelesaikan tugas.</p><div class="modalactions"><button type="button" class="btn" onclick="closeModal();render()">Simpan progres</button><button class="btn primary">Selesaikan pekerjaan</button></div>'}</form>`)}
function updateCheck(id,i,v){const t=data.tasks.find(t=>t.id===id);t.checks[i]=v;t.status='Dikerjakan';save()}
function saveTaskNote(id,n){data.tasks.find(t=>t.id===id).note=n;save()}
function completeTask(e,id){e.preventDefault();const t=data.tasks.find(t=>t.id===id);if(!t.checks.every(Boolean)){toast('Selesaikan seluruh checklist terlebih dahulu.');return}if(!e.target.note.value.trim()){toast('Isi catatan hasil pemeriksaan terlebih dahulu.');return}t.status='Selesai';t.note=e.target.note.value;if(t.requestId){data.requests.find(r=>r.id===t.requestId).status='Selesai'}save();closeModal();render();toast('Pekerjaan selesai. Laporan tersimpan untuk pengelola.')}
const merchants=[{name:'Laundry Bersih',category:'Laundry kiloan',desc:'Cuci, kering, dan lipat. Estimasi 2 hari.',price:10000,unit:'kg',icon:'shop'},{name:'Galon Harmoni',category:'Air minum',desc:'Antar galon langsung ke depan unit Anda.',price:22000,unit:'galon',icon:'shop'},{name:'Teknik Sejuk',category:'Servis AC',desc:'Pembersihan dan pemeriksaan AC oleh teknisi.',price:85000,unit:'unit AC',icon:'tool'}];
function marketPage(){return heading('Layanan hunian','Kebutuhan sehari-hari, lebih mudah.','Layanan mitra internal untuk penghuni Taman Harmoni.')+`<div class="notice">Pemesanan di halaman ini adalah simulasi. Tidak dikirim kepada merchant dan tidak memproses pembayaran.</div><div class="cards">${merchants.map((m,i)=>`<section class="panel"><div class="cardbody"><span class="cardicon">${icon(m.icon)}</span><small>${m.category}</small><h2 style="margin-top:5px">${m.name}</h2><p>${m.desc}</p><div style="font-size:21px;font-weight:650;margin-bottom:18px">${money(m.price)} <small>/ ${m.unit}</small></div>${btn('Pesan layanan',`orderForm(${i})`,true,'plus')}</div></section>`).join('')}</div><section class="panel" style="margin-top:23px"><div class="panelhead"><h2>Pesanan demo ${role==='tenant'?'saya':''}</h2></div><div class="tablewrap"><table><thead><tr><th>LAYANAN</th><th>UNIT</th><th>JUMLAH</th><th>TOTAL</th><th>STATUS</th></tr></thead><tbody>${data.orders.filter(o=>role!=='tenant'||o.unit==='A-1205').map(o=>`<tr><td>${merchants[o.merchant].name}</td><td>${o.unit}</td><td>${o.quantity}</td><td>${money(o.total)}</td><td>${statusBadge('Pesanan demo')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Belum ada pesanan. Pilih layanan untuk mencoba.</td></tr>'}</tbody></table></div></section>`}
function orderForm(i){const m=merchants[i];openModal('Pesan '+m.name,money(m.price)+' / '+m.unit,`<form onsubmit="placeOrder(event,${i})"><label class="field">Unit<select name="unit">${data.units.filter(u=>role!=='tenant'||u.id==='A-1205').map(u=>`<option>${u.id}</option>`).join('')}</select></label><label class="field">Jumlah (${m.unit})<input type="number" name="quantity" min="1" max="20" value="1" required oninput="$('#orderTotal').textContent=money(this.value*${m.price})"></label><label class="field">Catatan<textarea name="note" placeholder="Contoh: Antar setelah pukul 17.00" maxlength="300"></textarea></label><div class="rowflex"><span>Total</span><strong id="orderTotal">${money(m.price)}</strong></div><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Buat pesanan demo</button></div></form>`)}
function placeOrder(e,i){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));data.orders.push({...f,merchant:i,total:Number(f.quantity)*merchants[i].price});save();closeModal();render();toast('Pesanan demo tersimpan. Tidak ada pesanan nyata yang dikirim.')}
function automationPage(){return heading('Otomasi operasional','Pekerjaan rutin, lebih ringan.','Pengingat dan ringkasan bekerja di belakang layar. Coba alurnya di sini.',btn('Lihat morning recap','briefModal()',true,'auto'))+`<div class="notice">Seluruh jadwal adalah simulasi tampilan. WhatsApp, email, AI, dan ekspor otomatis belum terhubung ke layanan eksternal.</div><div class="cards">${[['reminder','Pengingat WhatsApp','H−7 · H−3 · Hari H · H+3 · H+7','Siklus pengingat tagihan sesuai jatuh tempo.'],['brief','Morning briefing','Setiap hari · 07.30 WIB','Ringkasan penerimaan, tunggakan, dan izin aktif.'],['export','Laporan mingguan','Setiap Senin · 08.00 WIB','Rencana pengiriman Excel ke email pimpinan.']].map(([k,t,s,d])=>`<section class="panel"><div class="cardbody"><span class="cardicon">${icon('auto')}</span><h2>${t}</h2><p>${s}<br>${d}</p><div class="rowflex">${statusBadge(data.automation[k]?'Simulasi aktif':'Simulasi nonaktif')}<button class="btn small" onclick="toggleAuto('${k}')">${data.automation[k]?'Nonaktifkan':'Aktifkan'}</button></div></div></section>`).join('')}</div><section class="panel" style="margin-top:23px"><div class="panelhead"><div><h2>Simulasi pengingat tagihan</h2><p>Pratinjau pesan personal dan catat simulasi pengiriman</p></div></div><div class="tablewrap"><table><thead><tr><th>UNIT / PENGHUNI</th><th>TAGIHAN</th><th>STATUS</th><th>AKSI</th></tr></thead><tbody>${data.bills.filter(b=>b.status!=='Lunas').map(b=>`<tr><td>${b.unit}<small>${esc(resident(b.unit))}</small></td><td>${money(total(b))}</td><td>${statusBadge(b.status)}</td><td><button class="link" onclick="reminderModal('${b.id}')">Pratinjau pesan ↗</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Tidak ada tagihan belum lunas.</td></tr>'}</tbody></table></div></section><section class="panel" style="margin-top:23px"><div class="panelhead"><h2>Riwayat simulasi</h2></div><div class="cardbody">${data.logs.length?data.logs.slice().reverse().map(l=>`<p><strong>${esc(l.unit)} · ${esc(l.cycle)}</strong> — ${esc(l.time)}<br>Simulasi dicatat, tanpa pengiriman WhatsApp.</p>`).join(''):'<p>Belum ada simulasi pengingat.</p>'}</div></section>`}
function toggleAuto(k){data.automation[k]=!data.automation[k];save();render();toast('Pengaturan simulasi diperbarui.')}
function reminderModal(id){const b=data.bills.find(b=>b.id===id);openModal('Pratinjau pengingat WhatsApp','Simulasi saja · Tidak mengirim pesan kepada penghuni.',`<label class="field">Tahap pengingat<select id="reminderCycle" onchange="$('#waMessage').textContent=reminderText('${id}',this.value)"><option>H-7</option><option>H-3</option><option>Hari H</option><option selected>H+3</option><option>H+7</option></select></label><div class="message" id="waMessage"></div><div class="modalactions"><button class="btn" onclick="closeModal()">Tutup</button><button class="btn primary" onclick="logReminder('${id}')" ${data.automation.reminder?'':'disabled'}>Jalankan simulasi</button></div>${!data.automation.reminder?'<p class="hint">Aktifkan simulasi pengingat di menu Otomasi & laporan.</p>':''}`);$('#waMessage').textContent=reminderText(id,'H+3')}
function reminderText(id,cycle){const b=data.bills.find(b=>b.id===id);return `Halo Bapak/Ibu ${resident(b.unit)},\n\nBerikut ${cycle.startsWith('H+')?'pengingat keterlambatan':'pengingat'} tagihan unit ${b.unit}, periode ${b.period}.\n\nIPL: ${money(b.ipl)}\nListrik: ${money(b.electric)}\nAir: ${money(b.water)}\nSinking fund: ${money(b.fund)}\nTotal: ${money(total(b))}\nJatuh tempo: ${b.due}\n\nDenda: tidak diterapkan pada demo.\nRekening tujuan: [rekening pengelola — contoh].\nKonfirmasi melalui menu Tagihan saya.\n\nTerima kasih,\nPengelola Taman Harmoni\n\n[DEMO · Tahap ${cycle} · Tidak dikirim]`}
function logReminder(id){const b=data.bills.find(b=>b.id===id);data.logs.push({unit:b.unit,cycle:$('#reminderCycle').value,time:new Date().toLocaleString('id-ID',{timeZone:'Asia/Jakarta'})});save();closeModal();render();toast('Simulasi pengingat dicatat. Tidak ada pesan WhatsApp yang dikirim.')}
function briefModal(){const bs=data.bills,paid=bs.filter(b=>b.status==='Lunas');openModal('Ringkasan pagi pengelola','Contoh morning briefing · 29 Oktober 2026 · 07.30 WIB',`<div class="message">Selamat pagi, Dina.\n\nPenerimaan periode demo: ${money(paid.reduce((s,b)=>s+total(b),0))}.\n${bs.filter(b=>b.status==='Menunggak').length} unit memiliki tagihan menunggak.\n${data.requests.filter(r=>r.type==='Renovasi'&&r.status==='Disetujui').length} izin renovasi aktif.\n${data.tasks.filter(t=>t.date==='2026-10-29'&&t.status!=='Selesai').length} pekerjaan belum selesai hari ini.\n\nPrioritas: verifikasi pembayaran dan tinjau izin yang masuk.</div><p class="hint">Ringkasan dihitung dari data demo saat ini, tanpa pemrosesan AI atau pengiriman otomatis.</p><div class="modalactions"><button class="btn" onclick="downloadReport()">Unduh laporan CSV</button><button class="btn primary" onclick="closeModal()">Selesai</button></div>`)}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type:type+';charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadReport(){const cell=v=>'"'+String(v).replace(/^[=+@-]/,"'").replace(/"/g,'""')+'"';const rows=[['Invoice','Unit','Penghuni','Periode','IPL','Listrik','Air','Sinking fund','Total','Status'],...scopedBills().map(b=>[b.id,b.unit,resident(b.unit),b.period,b.ipl,b.electric,b.water,b.fund,total(b),b.status])];download('Huni-laporan-tagihan-demo.csv','\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv');toast('Laporan CSV diunduh, dapat dibuka di Excel.')}
function openModal(title,sub,body){if(!$('#modalroot').innerHTML)lastFocus=document.activeElement;$('#modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><dialog role="dialog" aria-modal="true" aria-labelledby="modaltitle"><button class="close" aria-label="Tutup dialog" onclick="closeModal()">×</button><h2 id="modaltitle">${esc(title)}</h2><p>${esc(sub)}</p>${body}</dialog></div>`;document.body.style.overflow='hidden';setTimeout(()=>{$('dialog input,dialog select,dialog textarea,dialog .btn,dialog .close')?.focus()},0)}
function closeModal(){$('#modalroot').innerHTML='';document.body.style.overflow='';if(page==='vendor'&&session)render();lastFocus?.focus()}
document.addEventListener('keydown',e=>{const d=$('dialog');if(!d)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=[...d.querySelectorAll('button:not(:disabled),input:not(:disabled),select,textarea:not(:disabled),a[href]')],first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function resetDemo(){openModal('Kembalikan data awal?','Semua perubahan demo di browser ini akan diganti dengan data contoh.',`<div class="modalactions"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="data=structuredClone(seed);save();closeModal();go(role==='bm'?'dashboard':role==='tenant'?'portal':'vendor');toast('Data demo dikembalikan.')">Kembalikan data</button></div>`)}
function loginMarkup(){return `<aside class="login-story"><div class="brand"><span class="brandmark">${icon('home')}</span>huni<span style="color:#a1bdb0">.</span></div><div><div class="eyebrow">TAMAN HARMONI RESIDENCES</div><h1>Hunian terkelola.<br>Semua lebih tenang.</h1><p>Satu ruang untuk pengelola, penghuni, dan mitra. Dari tagihan hingga perawatan, setiap kebutuhan punya tempat.</p><div class="story-art" aria-hidden="true">${[1,2,3].map(()=>'<div class="story-tower">'+Array.from({length:12},()=>'<i></i>').join('')+'</div>').join('')}</div><p style="font-size:12px">Terhubung dalam satu alur.<br>Penghuni mengajukan. Pengelola meninjau. Vendor menyelesaikan.</p></div><div class="story-footer">© 2026 Huni · Property Management Demo</div></aside><main class="login-main"><div class="login-inner"><div class="brand login-mobilebrand"><span class="brandmark">${icon('home')}</span>huni.</div><div class="login-top"><span class="badge green">● Demo interaktif</span><span class="login-subtitle">3 peran · 1 ekosistem</span></div><h2>Selamat datang di Huni.</h2><p class="login-intro">Pilih akun demo untuk mencoba pengalaman sesuai peran Anda.</p><span class="login-subtitle">1. Pilih peran untuk mengisi akun contoh</span><div class="rolecards">${Object.entries(accounts).map(([k,a])=>`<button type="button" class="rolecard ${k===selectedLoginRole?'selected':''}" data-role="${k}" aria-pressed="${k===selectedLoginRole}" onclick="selectLoginRole('${k}')">${icon(a.icon)}<strong>${a.label}</strong><small>${k==='bm'?'Dina Rahma':k==='tenant'?'Aditya · A-1205':'PT Elevasi Teknik'}</small></button>`).join('')}</div><div class="demo-credentials"><span id="demoScope">${accounts[selectedLoginRole].summary}</span><br>Email: <strong id="demoEmail">${accounts[selectedLoginRole].email}</strong><br>Kata sandi semua akun: <strong>demo123</strong></div><form id="loginform" onsubmit="submitLogin(event)"><div id="loginerror" class="login-error" role="alert" hidden></div><label class="field" for="loginEmail">2. Email akun demo<input id="loginEmail" type="email" name="email" autocomplete="off" autocapitalize="none" spellcheck="false" value="${accounts[selectedLoginRole].email}" required></label><label class="field" for="loginPassword">Kata sandi demo<span class="passwordfield"><input id="loginPassword" name="password" type="password" value="demo123" autocomplete="off" required><button type="button" id="passwordToggle" aria-label="Tampilkan kata sandi" aria-pressed="false" onclick="toggleLoginPassword()">Lihat</button></span></label><div class="login-help"><span class="login-subtitle" id="loginIdentity">${accounts[selectedLoginRole].name} · ${accounts[selectedLoginRole].context}</span><button type="button" class="link" onclick="loginHelp()">Bantuan</button></div><button class="btn primary login-submit" type="submit" id="loginSubmit">Masuk sebagai ${accounts[selectedLoginRole].label} &nbsp; →</button></form><p class="login-caption">Login ini adalah simulasi untuk presentasi.<br>Gunakan akun contoh di atas. Tidak ada koneksi ke akun nyata.</p></div></main>`}
function renderLogin(){session=null;$('#appview').hidden=true;$('#loginview').hidden=false;$('#content').innerHTML='';$('#nav').innerHTML='';$('#sidebar').classList.remove('open');$('#loginview').innerHTML=loginMarkup();document.title='Huni — Login Demo';}
function selectLoginRole(r){if(!accounts[r])return;selectedLoginRole=r;const a=accounts[r];document.querySelectorAll('.rolecard').forEach(b=>{const active=b.dataset.role===r;b.classList.toggle('selected',active);b.setAttribute('aria-pressed',String(active))});$('#loginEmail').value=a.email;$('#loginPassword').value='demo123';$('#demoEmail').textContent=a.email;$('#demoScope').textContent=a.summary;$('#loginIdentity').textContent=a.name+' · '+a.context;$('#loginSubmit').textContent='Masuk sebagai '+a.label+' →';$('#loginerror').hidden=true;}
function toggleLoginPassword(){const input=$('#loginPassword'),button=$('#passwordToggle'),show=input.type==='password';input.type=show?'text':'password';button.textContent=show?'Sembunyikan':'Lihat';button.setAttribute('aria-pressed',String(show));button.setAttribute('aria-label',show?'Sembunyikan kata sandi':'Tampilkan kata sandi');}
function loginHelp(){openModal('Mencoba akun demo','Tidak perlu mendaftar atau menggunakan akun asli.',`<p>Pilih salah satu kartu peran untuk mengisi email dan kata sandi contoh, lalu tekan <strong>Masuk</strong>.</p><div class="billrows">${Object.values(accounts).map(a=>`<div><span>${a.label}</span><strong>${a.email}</strong></div>`).join('')}<div><span>Kata sandi semua akun</span><strong>demo123</strong></div></div><p class="hint">Untuk berganti peran, tekan Keluar setelah masuk. Data simulasi antarperan tetap tersimpan di browser yang sama.</p><div class="modalactions"><button class="btn primary" onclick="closeModal()">Mengerti</button></div>`)}
function submitLogin(e){e.preventDefault();const f=new FormData(e.target),email=String(f.get('email')||'').trim().toLowerCase(),r=Object.keys(accounts).find(k=>accounts[k].email===email);if(!r||f.get('password')!=='demo123'){const error=$('#loginerror');error.textContent='Email atau kata sandi demo tidak sesuai. Pilih kartu peran untuk menggunakan akun contoh.';error.hidden=false;$('#loginPassword').focus();return false}session={role:r};role=r;page=accounts[r].home;query='';filter='Semua';rememberSession();document.title='Huni — '+accounts[r].label;render();window.scrollTo(0,0);toast('Selamat datang, '+accounts[r].name+'.');return true;}
function rememberSession(){if(!session)return;try{sessionStorage.setItem(SESSION_KEY,JSON.stringify({role:session.role,page}))}catch{}}
function logoutDemo(){const previousRole=session?.role||'bm';session=null;try{sessionStorage.removeItem(SESSION_KEY)}catch{}$('#modalroot').innerHTML='';document.body.style.overflow='';$('#sidebar').classList.remove('open');$('#toastroot').innerHTML='';clearTimeout(toastTimer);selectedLoginRole=previousRole;query='';filter='Semua';page='login';renderLogin();window.scrollTo(0,0);$('#loginSubmit').focus();}
function restoreDemoSession(){try{const stored=JSON.parse(sessionStorage.getItem(SESSION_KEY));if(stored&&accounts[stored.role]){session={role:stored.role};role=stored.role;page=navs[role].some(n=>n[0]===stored.page)?stored.page:accounts[role].home;document.title='Huni — '+accounts[role].label;return true}}catch{}return false;}
function allowedRole(...roles){return !!session&&session.role===role&&roles.includes(role)}
function allowedBill(id){const b=data.bills.find(b=>b.id===id);return allowedRole('bm','tenant')&&!!b&&(role==='bm'||b.unit==='A-1205')}
function allowedRequest(id){const r=data.requests.find(r=>r.id===id);return allowedRole('bm','tenant')&&!!r&&(role==='bm'||r.unit==='A-1205')}
function allowedTask(id,edit=false){const t=data.tasks.find(t=>t.id===id);return !!t&&(edit?allowedRole('vendor')&&t.vendor==='PT Elevasi Teknik'&&t.status!=='Selesai':allowedRole('bm')||allowedRole('vendor')&&t.vendor==='PT Elevasi Teknik')}
function installDemoGuards(){const bm=()=>allowedRole('bm'),residentAccess=()=>allowedRole('bm','tenant'),billArg=id=>allowedBill(id),requestArg=id=>allowedRequest(id);const gates={unitDetail:bm,unitForm:bm,addUnit:bm,newBilling:bm,createBilling:bm,verify:id=>bm()&&allowedBill(id),invoice:billArg,paymentForm:id=>billArg(id)&&!['Lunas','Menunggu verifikasi'].includes(data.bills.find(b=>b.id===id).status),submitPayment:(e,id)=>billArg(id)&&!['Lunas','Menunggu verifikasi'].includes(data.bills.find(b=>b.id===id).status),receipt:id=>billArg(id)&&data.bills.find(b=>b.id===id).status==='Lunas',requestForm:residentAccess,requestDetail:requestArg,submitRequest:e=>residentAccess()&&(role==='bm'||new FormData(e.target).get('unit')==='A-1205'),advanceRequest:id=>bm()&&allowedRequest(id)&&!['Disetujui','Ditolak','Selesai'].includes(data.requests.find(r=>r.id===id).status),rejectForm:id=>bm()&&allowedRequest(id),rejectRequest:id=>bm()&&allowedRequest(id),permit:id=>requestArg(id)&&data.requests.find(r=>r.id===id).status==='Disetujui',taskModal:id=>allowedTask(id),updateCheck:id=>allowedTask(id,true),saveTaskNote:id=>allowedTask(id,true),completeTask:(e,id)=>allowedTask(id,true),orderForm:residentAccess,placeOrder:e=>residentAccess()&&(role==='bm'||new FormData(e.target).get('unit')==='A-1205'),downloadReport:residentAccess,toggleAuto:bm,reminderModal:id=>bm()&&allowedBill(id),logReminder:id=>bm()&&allowedBill(id),briefModal:bm,resetDemo:bm};for(const [name,gate] of Object.entries(gates)){const original=globalThis[name];globalThis[name]=function(...args){if(!gate(...args)){args[0]?.preventDefault?.();toast(session?'Aksi ini tidak tersedia untuk akun atau status ini.':'Silakan masuk dengan akun demo terlebih dahulu.');return}return original.apply(this,args)}}}
$('#buildingicon').innerHTML=icon('unit');installDemoGuards();restoreDemoSession();render();
</script>
